{{ if or .Params.math .Site.Params.math }}
<link rel="stylesheet"
  href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css"
  crossorigin="anonymous" />
<script defer
  src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"
  crossorigin="anonymous"></script>
<script defer
  src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"
  crossorigin="anonymous"
  onload="renderMathInElement(document.body, {
    delimiters: [
      { left: '$$', right: '$$', display: true },
      { left: '\\(', right: '\\)', display: false }
    ],
    throwOnError: false
  });"></script>
{{ end }}

{{ if or .Params.mermaid .Site.Params.mermaid }}
<script type="module">
  // Keep the source readable if the diagram dependency cannot be reached.
  try {
    const { default: mermaid } = await import('https://cdn.jsdelivr.net/npm/mermaid@11.17.2/dist/mermaid.esm.min.mjs');
    mermaid.initialize({
      startOnLoad: false,
      securityLevel: 'strict',
      theme: 'base',
      themeVariables: {
        darkMode: true,
        background: '#101110',
        primaryColor: '#24251f',
        primaryTextColor: '#e9e5d9',
        primaryBorderColor: '#bca574',
        secondaryColor: '#1c1d18',
        tertiaryColor: '#101110',
        lineColor: '#bca574',
        fontFamily: 'Arial, sans-serif'
      }
    });
    let diagramIndex = 0;
    for (const el of document.querySelectorAll('pre > code.language-mermaid')) {
      const { svg, bindFunctions } = await mermaid.render(`diagram-${diagramIndex++}`, el.textContent);
      const figure = document.createElement('div');
      figure.className = 'mermaid';
      figure.innerHTML = svg;
      el.parentElement.replaceWith(figure);
      bindFunctions?.(figure);
    }
  } catch (error) {
    console.warn('Diagram rendering unavailable; showing the source.', error);
  }
</script>
{{ end }}
